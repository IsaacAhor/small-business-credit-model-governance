name: Controlled release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag, for example v0.12.0
        required: true
        type: string

concurrency:
  group: controlled-release
  cancel-in-progress: false

jobs:
  build_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.release_identity.outputs.commit }}
      release_tag_object: ${{ steps.release_identity.outputs.tag_object }}
    steps:
      - name: Validate release input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate and bind release identity
        id: release_identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{tag}" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          test -f "docs/releases/${RELEASE_TAG}.md"
          python -c 'import os, pathlib, tomllib; expected = os.environ["RELEASE_TAG"][1:]; actual = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]; raise SystemExit(0 if actual == expected else "Package version does not match release tag.")'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag_object=$(git rev-parse "refs/tags/${RELEASE_TAG}")" >> "$GITHUB_OUTPUT"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@eb5ca3ab411449c66620fe7f1b3c9e10547144b0 # v18
        with:
          globs: |
            **/*.md

      - name: Install pinned build and validation tools
        run: python -m pip install "pip==25.1.1" "build==1.5.0" "twine==6.2.0"

      - name: Install public-data test dependencies
        run: python -m pip install "numpy>=1.26" "pandas>=2.1" "scikit-learn>=1.4"

      - name: Run repository and unit checks
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          python scripts/validate_phase1.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build and inspect exact distributions
        run: |
          set -euo pipefail
          python -m build
          python scripts/normalize_sdist.py dist/*.tar.gz
          python -m twine check dist/*
          python scripts/validate_public_artifacts.py dist
          mkdir -p .tmp-release/candidate
          cp dist/* .tmp-release/candidate/
          (cd .tmp-release/candidate && sha256sum credit_gov-* > SHA256SUMS.txt)
          (cd .tmp-release/candidate && sha256sum --check SHA256SUMS.txt)
          python scripts/validate_public_artifacts.py .tmp-release/candidate

      - name: Preserve the verified candidate between jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ inputs.tag }}
          path: .tmp-release/candidate/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  publish:
    needs: build_and_verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Validate release input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build_and_verify.outputs.release_commit }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Retrieve the verified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ inputs.tag }}
          path: .tmp-release/candidate

      - name: Reverify candidate after transfer
        env:
          EXPECTED_COMMIT: ${{ needs.build_and_verify.outputs.release_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.build_and_verify.outputs.release_tag_object }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}")" = "$EXPECTED_TAG_OBJECT"
          test "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "$EXPECTED_TAG_OBJECT"
          (cd .tmp-release/candidate && sha256sum --check SHA256SUMS.txt)
          python scripts/validate_public_artifacts.py .tmp-release/candidate

      - name: Create and verify private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "docs/releases/${RELEASE_TAG}.md"
          gh release upload "$RELEASE_TAG" \
            .tmp-release/candidate/*
          mkdir -p .tmp-release/draft-download
          gh release download "$RELEASE_TAG" \
            --dir .tmp-release/draft-download
          (cd .tmp-release/draft-download && sha256sum --check ../candidate/SHA256SUMS.txt)
          python scripts/validate_public_artifacts.py .tmp-release/draft-download

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify the served release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .tmp-release/published-download
          gh release download "$RELEASE_TAG" \
            --dir .tmp-release/published-download
          (cd .tmp-release/published-download && sha256sum --check ../candidate/SHA256SUMS.txt)
          python scripts/validate_public_artifacts.py .tmp-release/published-download
