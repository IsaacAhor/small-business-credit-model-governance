name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@eb5ca3ab411449c66620fe7f1b3c9e10547144b0 # v18
        with:
          globs: |
            **/*.md

      - name: Install build backend
        run: python -m pip install "pip==25.1.1" "build==1.5.0"

      - name: Build distribution artifacts
        run: python -m build

      - name: Normalize source distribution metadata
        run: python scripts/normalize_sdist.py dist/*.tar.gz

      - name: Check distribution portability
        run: python scripts/validate_public_artifacts.py dist

      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Install public-data test dependencies
        run: python -m pip install "numpy>=1.26" "pandas>=2.1" "scikit-learn>=1.4"

      - name: Smoke test installed commands
        run: |
          credit-gov-validate data/synthetic/monthly-demo
          credit-gov monitor data/synthetic/monthly-demo --evidence-root .tmp-ci-evidence
          evidence_pack="$(find .tmp-ci-evidence -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$evidence_pack"
          credit-gov verify-evidence "$evidence_pack"
          credit-gov-verify-evidence "$evidence_pack"
          credit-gov change-review data/synthetic/monthly-portfolio
          credit-gov-governance-review data/synthetic/monthly-demo .tmp-ci-governance-review
          credit-gov-vendor-validate data/synthetic/credit-union-vendor-risk/baseline-complete data/synthetic/monthly-demo
          credit-gov-vendor-report data/synthetic/credit-union-vendor-risk/baseline-complete data/synthetic/monthly-demo .tmp-ci-vendor-review
          credit-gov-recourse-validate data/synthetic/adverse-action-reason-benchmark data/synthetic/recourse-assessment/baseline
          credit-gov-recourse-report data/synthetic/adverse-action-reason-benchmark data/synthetic/recourse-assessment/baseline .tmp-ci-recourse-review

      - name: Verify expected starter files exist
        run: python scripts/validate_repository.py

      - name: Validate Phase 1 demo dataset
        run: python scripts/validate_phase1.py

      - name: Run monthly monitoring smoke test
        run: python scripts/run_monthly_monitoring.py data/synthetic/monthly-demo --evidence-root .tmp-ci-evidence-script

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
