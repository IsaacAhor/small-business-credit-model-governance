name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  markdown-and-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md

      - name: Verify expected starter files exist
        run: python scripts/validate_repository.py

      - name: Validate Phase 1 demo dataset
        run: python scripts/validate_phase1.py

      - name: Run monthly monitoring smoke test
        run: python scripts/run_monthly_monitoring.py data/synthetic/monthly-demo --evidence-root .tmp-ci-evidence

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
